# Déploie le site sur GitHub Pages à chaque push sur main.
# Prérequis (une seule fois) : Settings → Pages → Source : "GitHub Actions".
# Adresse en ligne : https://db-developpement.github.io/cac-sai/
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # GitHub Pages ne connaît pas les routes de React Router :
      # un rechargement sur /cac-sai/cactus renverrait une 404.
      # En copiant index.html en 404.html, c'est l'app qui s'affiche et React Router prend le relais.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
