<!--
  Tumbleweed (virevoltant) dessiné à la main pour CacSaï.
  Boule de branches sèches : ellipses tournées + brindilles irrégulières.
  Utilisé dans Home.jsx (décor animé côté désert).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke-linecap="round">
  <defs>
    <!-- Cœur dense : brindilles serrées vues de loin = masse brune semi-opaque -->
    <radialGradient id="coeur" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6e5230" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#8a663a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8a663a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="40" fill="url(#coeur)" />

  <!-- Contour : ellipses entrecroisées, trois teintes de bois sec -->
  <g stroke="#9c7643" stroke-width="1.6" stroke-opacity="0.95">
    <ellipse cx="50" cy="50" rx="42" ry="20" transform="rotate(10 50 50)" />
    <ellipse cx="50" cy="50" rx="40" ry="22" transform="rotate(70 50 50)" />
    <ellipse cx="50" cy="50" rx="41" ry="19" transform="rotate(130 50 50)" />
  </g>
  <g stroke="#7a5a32" stroke-width="1.3" stroke-opacity="0.9">
    <ellipse cx="50" cy="50" rx="38" ry="26" transform="rotate(40 50 50)" />
    <ellipse cx="50" cy="50" rx="36" ry="24" transform="rotate(100 50 50)" />
    <ellipse cx="50" cy="50" rx="39" ry="15" transform="rotate(160 50 50)" />
  </g>
  <g stroke="#c49a5e" stroke-width="1" stroke-opacity="0.85">
    <ellipse cx="50" cy="50" rx="30" ry="12" transform="rotate(25 50 50)" />
    <ellipse cx="50" cy="50" rx="28" ry="14" transform="rotate(85 50 50)" />
    <ellipse cx="50" cy="50" rx="31" ry="11" transform="rotate(145 50 50)" />
    <circle cx="50" cy="50" r="20" />
  </g>
  <!-- Brindilles qui dépassent : silhouette moins parfaite, plus naturelle -->
  <g stroke="#8a663a" stroke-width="1.1">
    <path d="M12 38 Q6 33 4 26" />
    <path d="M88 62 Q95 66 97 73" />
    <path d="M30 88 Q26 94 20 96" />
    <path d="M70 12 Q74 6 80 4" />
    <path d="M90 34 Q96 30 98 24" />
    <path d="M10 66 Q4 70 3 77" />
    <path d="M24 30 Q34 44 30 58 Q40 64 52 60" />
    <path d="M62 30 Q56 42 66 52 Q72 62 64 72" />
    <path d="M38 22 Q48 30 58 26" />
    <path d="M36 76 Q46 70 58 78" />
  </g>
  <!-- Enchevêtrement intérieur : courbes croisées pour la densité -->
  <g stroke="#a8834f" stroke-width="0.9" stroke-opacity="0.8">
    <path d="M20 50 Q35 30 50 48 T80 46" />
    <path d="M22 60 Q40 74 54 58 T82 58" />
    <path d="M44 16 Q30 36 46 50 T44 84" />
    <path d="M58 18 Q72 36 56 52 T60 84" />
    <path d="M28 24 Q50 40 72 24" />
    <path d="M28 76 Q50 60 72 78" />
    <path d="M16 44 Q30 52 18 62" />
    <path d="M84 40 Q70 50 84 60" />
  </g>
</svg>
