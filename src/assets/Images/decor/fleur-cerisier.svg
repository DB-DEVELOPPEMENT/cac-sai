<!--
  Fleur de cerisier (sakura) dessinée à la main pour CacSaï.
  1 pétale (avec l'encoche typique en pointe) répété 5 fois par rotation de 72°.
  Utilisé dans Home.jsx (décor animé côté jardin zen).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <defs>
    <!-- Dégradé : blanc rosé au centre, rose plus soutenu en bord de pétale -->
    <radialGradient id="degrade-petale" cx="50%" cy="85%" r="80%">
      <stop offset="0%" stop-color="#fff5f8" />
      <stop offset="60%" stop-color="#f9cfdd" />
      <stop offset="100%" stop-color="#ef9ab8" />
    </radialGradient>
    <!-- Un pétale pointé vers le haut, encoche à son extrémité -->
    <path id="petale" d="M50 50 C38 40 34 24 43 13 L50 19 L57 13 C66 24 62 40 50 50 Z" fill="url(#degrade-petale)" />
  </defs>

  <use xlink:href="#petale" href="#petale" />
  <use xlink:href="#petale" href="#petale" transform="rotate(72 50 50)" />
  <use xlink:href="#petale" href="#petale" transform="rotate(144 50 50)" />
  <use xlink:href="#petale" href="#petale" transform="rotate(216 50 50)" />
  <use xlink:href="#petale" href="#petale" transform="rotate(288 50 50)" />

  <!-- Cœur et étamines -->
  <circle cx="50" cy="50" r="5" fill="#e0628c" />
  <g fill="#c9a45c">
    <circle cx="50" cy="40" r="1.6" />
    <circle cx="59" cy="47" r="1.6" />
    <circle cx="56" cy="58" r="1.6" />
    <circle cx="44" cy="58" r="1.6" />
    <circle cx="41" cy="47" r="1.6" />
  </g>
</svg>
